# Cloudflare Workers static assets (Workers Builds / `npx wrangler deploy`).
#
# IMPORTANT:
#   - The dashboard "Root directory" must be the repository root (`/`), NOT `dist`.
#     `dist/` is produced by `npm run build:pages` during the build step.
#   - Set `name` to the exact Worker name shown in the Cloudflare dashboard.
name = "fingerprint"
main = "worker/index.js"
compatibility_date = "2026-11-15"

[assets]
directory = "./dist"
binding = "ASSETS"
